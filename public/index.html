<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#faf9f5">
  <meta name="description" content="Compare prices shoppers saw for the same offer. Explore the reports and check your own quote privately.">
  <title>PriceWitness — Explore prices</title>
  <link rel="manifest" href="/app.webmanifest">
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/price-plot.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
<a class="skip" href="#index">Skip to comparisons</a>
<header class="mast"><div class="wrap mast-inner">
  <a class="brand" href="/" aria-label="PriceWitness home"><img src="/favicon.svg" width="35" height="33" alt=""><span>PriceWitness</span></a>
  <nav aria-label="Primary navigation">
    <button data-act="find" class="nav active" aria-label="Find an offer"><i data-icon="search"></i>Find an offer</button>
    <button data-act="saved" class="nav"><i data-icon="bookmark"></i>Watchlist</button>
    <button data-act="feeds" class="nav feeds-nav" aria-label="App feeds"><i data-icon="link"></i><span>App feeds</span></button>
    <button data-act="mine" class="nav mine-nav">My reports</button>
  </nav>
  <div class="head-actions"><button class="report-btn" data-act="share" aria-label="Report a price"><i data-icon="plus"></i><span>Report<span class="report-suffix"> a price</span></span></button><button class="profile" data-act="profile" aria-label="Contributor profile"><i data-icon="user"></i></button></div>
</div></header>
<main class="wrap shell">
  <div id="page-intro" class="page-intro" hidden><h1 id="page-title">Explore prices</h1><p id="page-sub"></p></div>
  <section id="featured" aria-label="Featured comparison" aria-busy="true"><p class="feature-loading" role="status">Loading the featured comparison…</p></section>
  <section id="index" tabindex="-1" aria-labelledby="index-title">
    <div class="index-heading"><div class="index-label"><h2 id="index-title">Explore comparisons</h2><span id="result-count" aria-live="polite"></span></div>
    <form id="search-form" role="search"><i data-icon="search"></i><input type="search" name="query" id="search-term" aria-label="Search products, retailers or routes" placeholder="Search offers or retailers" maxlength="120"><kbd aria-hidden="true">/</kbd></form></div>
    <div class="index-controls"><div id="filters" class="filters" aria-label="Filter by category"></div><label class="sort-label"><i data-icon="sort"></i><select id="sort" aria-label="Sort comparisons"><option value="newest">Newest first</option><option value="gap">Widest % spread</option><option value="reports">Most sightings</option><option value="discussed">Most discussed</option><option value="helpful">Most helpful</option></select><i data-icon="down"></i></label></div>
    <div id="load-status" role="status"></div><div id="cards"></div><div id="more-posts"></div>
  </section>
</main>
<footer class="wrap site-foot"><span>PriceWitness</span><div><button data-act="how">How it works</button><button data-act="guidelines">Guidelines</button><button data-act="privacy">Privacy</button><a href="/methods">Methods &amp; data</a></div></footer>
<dialog id="dialog" aria-labelledby="dialog-title"></dialog><div id="toast" role="status"></div>
</body></html>
